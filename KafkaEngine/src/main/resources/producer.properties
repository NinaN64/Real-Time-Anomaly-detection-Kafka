# Kafka broker connection
bootstrap.servers=localhost:9092

# Topics
topic.raw.documents=raw-documents

# Producer tuning
acks=all
retries=3
linger.ms=5
batch.size=16384
compression.type=snappy

# Path to the exported 20 Newsgroups JSONL file
# Relative to where you run the jar from (project root)
dataset.path=Data/20newsgroups.jsonl

# Streaming rate — milliseconds between messages (0 = as fast as possible)
producer.rate.ms=100

# Drift injection settings
drift.enabled=true

# Number of documents over which gradual drift mixing occurs
drift.gradual.window=200

# Number of documents per half-period for recurring drift (A->B, then B->A)
drift.recurring.period=150