# Kafka connection
bootstrap.servers=localhost:9092

# Streams application ID — changing this resets all state stores
application.id=anomaly-streams-v1

# Topics
topic.input=raw-documents
topic.output.tumbling=preprocessed-batches-tumbling
topic.output.sliding=preprocessed-batches-sliding

# Windowing strategy: TUMBLING, SLIDING, or BOTH
window.strategy=BOTH

# Tumbling window size in seconds (e.g. 30 = one batch every 30s)
window.tumbling.size.seconds=30

# Sliding window size and advance interval in seconds
# advance < size means windows overlap
window.sliding.size.seconds=60
window.sliding.advance.seconds=15

# Minimum number of documents required to emit a batch
# Batches smaller than this are discarded (avoids tiny windows at startup)
window.min.batch.size=5

# Processing threads (set to number of topic partitions for max parallelism)
num.stream.threads=6

# RocksDB state store location
state.dir=/tmp/kafka-streams/anomaly